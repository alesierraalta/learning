<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Learnings video stage</title>
<link rel="stylesheet" href="stage.css">
<script src="/integrations/pi/kit/scene.js"></script>
</head>
<body>
<div id="stage">
  <div class="kicker" id="kicker" data-texture></div>
  <h1 id="title"></h1>
  <div class="rule"></div>
  <div class="figure"><svg id="fig" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg></div>
  <aside class="note">
    <div class="counter" id="counter" data-texture></div>
    <h2 id="stateTitle"></h2>
    <p id="stateText"></p>
  </aside>
  <div class="foot"><span class="brand" id="brand" data-texture></span></div>
  <div class="progress"><i id="bar"></i></div>
</div>
<script src="stage.js"></script>
</body>
</html>
