[package]
name = "learning-embed"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "embed"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
fastembed = { version = "=7.7.1", default-features = false, features = ["ort-load-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
