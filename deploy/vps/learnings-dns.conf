# Serve the studio's stable name to ZeroTier members only.
# This file is installed as /etc/dnsmasq.d/learnings.conf by deploy/vps/learnings-dns.sh.
listen-address=10.154.59.151
bind-interfaces
no-hosts
no-resolv
address=/learnings.infra.local/10.154.59.151
# Everything else keeps resolving through the host's own resolver.
server=10.10.10.1
