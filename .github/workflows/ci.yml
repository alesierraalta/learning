name: CI

# The engine, the Pi adapter and the studio have one source of truth: the
# suites documented in README.md and docs/protocol.md. CI runs exactly those
# commands on GitHub-hosted runners; the VPS runner only serves the deploy
# workflow.
#
# The commands run as parallel jobs. Each job runs a disjoint group of them and
# installs only what its group needs, so every suite still runs once. The wall
# time is the slowest job: today that is the Pi adapter job, because
# integrations/pi/bridge.test.mjs runs its browser tests one after another.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Node is here for the Go tests that run tools/explain-check.mjs and
  # tools/register/niveles.mjs. Playwright is not installed in this job: those
  # tests have always run without a browser, and they still do.
  engine:
    name: Go engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "gofmt reports unformatted files:" >&2
            printf '%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Engine tests
        run: go test ./... -count=1

      - name: Engine tests with the race detector
        run: go test -race ./... -count=1

      - name: Build the engine binary
        run: go build -o bin/learning ./cmd/learning

  # adapter.test.mjs skips its engine test when bin/learning is missing, so the
  # build comes first. The code-exercise tests skip themselves when a pinned
  # image is missing; pulling them here turns those skips into real runs. The
  # digests in runners.json are amd64, which is what ubuntu-latest is.
  adapter:
    name: Pi adapter and kit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the engine binary
        run: go build -o bin/learning ./cmd/learning

      - name: Pull the sandbox images
        run: |
          # Pull each digest-pinned reference and its plain tag: some suites
          # probe the tag directly, and the pinned pull alone leaves it absent.
          jq -r '.[].image' integrations/pi/runners.json \
            | sort -u \
            | while read -r image; do
                docker pull "$image"
                docker pull "${image%%@*}"
              done

      # node --test does not resolve globally installed modules, so the
      # suites import Playwright through PLAYWRIGHT_MODULE (the variable the
      # test files document for local runs).
      - name: Install Playwright
        run: |
          npm install --global playwright@1.64.1
          playwright install --with-deps chromium
          module="$(npm root -g)/playwright/index.mjs"
          echo "PLAYWRIGHT_MODULE=$module" >> "$GITHUB_ENV"

      - name: Adapter and kit suites
        run: |
          node --test integrations/pi/*.test.mjs \
            integrations/pi/kit/test/*.test.mjs

  # The studio starts the engine at bin/learning unless a test passes its own
  # path, so this job builds it too.
  studio:
    name: Studio
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the engine binary
        run: go build -o bin/learning ./cmd/learning

      - name: Install Playwright
        run: |
          npm install --global playwright@1.64.1
          playwright install --with-deps chromium
          module="$(npm root -g)/playwright/index.mjs"
          echo "PLAYWRIGHT_MODULE=$module" >> "$GITHUB_ENV"

      - name: Studio suites
        run: node --test studio/*.test.mjs

  # The video suites build their audio fixture with ffmpeg, and the engine
  # cannot render without it. Running the suites for the first time is what
  # found this: the step used to match no file, so it never needed it.
  media:
    name: Video and audio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # tools/video loads Playwright from the global npm root, not from
      # PLAYWRIGHT_MODULE, so the global install is what these suites need.
      - name: Install Playwright
        run: |
          npm install --global playwright@1.64.1
          playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Video, visuals and audio suites
        run: |
          node --test tools/video/test/*.test.mjs \
            tools/visuals/test/*.test.mjs \
            tools/audio/test/*.test.mjs

  # The register rules (#250) gate every explanation, so their tests run here
  # too, not only on a developer's machine. explain-check measures figures in a
  # browser through scene-lint, so this job installs Playwright as well.
  tools:
    name: Tools and register
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm install --global playwright@1.64.1
          playwright install --with-deps chromium
          module="$(npm root -g)/playwright/index.mjs"
          echo "PLAYWRIGHT_MODULE=$module" >> "$GITHUB_ENV"

      - name: Tools and register suites
        run: |
          node --test tools/test/relink-index.test.mjs \
            tools/page-gate.test.mjs \
            tools/register/*.test.mjs tools/explain-check.test.mjs

  # A broken deploy script only shows up when it runs, which for update.sh is
  # after the merge: it has already pulled over the live tree by then. This
  # job checks the scripts a pull request would introduce, before the merge.
  # pull_request only: the deploy workflow checks the live tree itself.
  deploy-scripts:
    name: Deploy scripts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check the shell syntax
        run: |
          for script in deploy/vps/*.sh; do
            bash -n "$script"
          done

      - name: Run shellcheck
        run: shellcheck --severity=warning deploy/vps/*.sh
