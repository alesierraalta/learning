name: Feature or improvement
description: Propose a verifiable improvement to Learnings.
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe the problem and the desired outcome.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions for completion.
    validations:
      required: true
